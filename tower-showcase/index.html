Id('dock');let id='plasma',mode='combat',tm=0,last=performance.now(),shot=0,parts=[];const enemies=Array.from({length:15},(_,i)=>({a:i/15*Math.PI*2,r:235+(i%4)*24,s:.12+i*.009,z:i===0?28:13+(i%3)*2}));function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;q.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();function rgba(h,a){let v=parseInt(h.slice(1),16);return`rgba(${v>>16},${v>>8&255},${v&255},${a})`}function rr(x,y,w,h,r){q.beginPath();q.roundRect(x,y,w,h,r)}function glow(x,y,r,col){let g=q.createRadialGradient(x,y,0,x,y,r*2.3);g.addColorStop(0,'#fff');g.addColorStop(.3,col);g.addColorStop(1,rgba(col,0));q.fillStyle=g;q.beginPath();q.arc(x,y,r*2.3,0,7);q.fill()}function tower(x,y,s,t,thumb=false){q.save();q.translate(x,y);q.scale(s,s);q.fillStyle='rgba(0,0,0,.22)';q.beginPath();q.ellipse(0,64,76,17,0,0,7);q.fill();q.fillStyle='#6f7c8e';q.beginPath();q.moveTo(-68,28);q.lineTo(-42,4);q.lineTo(42,4);q.lineTo(68,28);q.lineTo(46,58);q.lineTo(-46,58);q.closePath();q.fill();q.fillStyle=t.b;rr(-48,4,96,45,14);q.fill();q.fillStyle=t.t;[-1,1].forEach(k=>{rr(k*35-10,35,20,13,5);q.fill()});if(id==='plasma'||thumb&&t===T.plasma){glow(0,7,13,t.a);q.fillStyle='#edf4fa';[-1,1].forEach(k=>{q.save();q.translate(k*13,4);q.rotate(k*.7);rr(-6,-3,12,54,6);q.fill();q.fillStyle=t.a;q.fillRect(-2,38,4,12);q.restore()})}else if(id==='frost'||thumb&&t===T.frost){q.fillStyle=t.a;q.shadowColor=t.a;q.shadowBlur=20;q.beginPath();q.moveTo(0,-30);q.lineTo(17,3);q.lineTo(0,30);q.lineTo(-17,3);q.closePath();q.fill();q.shadowBlur=0;q.strokeStyle=t.a;q.lineWidth=3;q.beginPath();q.arc(0,4,35+Math.sin(tm*2)*2,0,7);q.stroke()}else if(id==='sniper'||thumb&&t===T.sniper){q.fillStyle='#f1ebf5';rr(-18,1,36,31,9);q.fill();q.save();q.translate(0,14);q.rotate(-.12);rr(0,-5,88,10,5);q.fill();q.fillStyle=t.a;q.fillRect(72,-3,13,6);q.restore()}else if(id==='tesla'||thumb&&t===T.tesla){glow(0,2,13,t.a);q.strokeStyle='#e9f7fb';q.line
