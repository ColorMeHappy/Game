<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#08101b" />
<title>BioCore Defense - Real 3D Tower Lab</title>
<link rel="stylesheet" href="real3d.css?v=real3d4" />
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div id="brand" class="panel">
    <small>BIOCORE DEFENSE v203</small>
    <strong>REAL 3D TOWER LAB</strong>
    <em>Stylized 3D Sci-Fi Horde Defense</em>
  </div>
  <div id="stats" class="panel">
    <div class="head"><span id="type">PLASMA</span><b id="name">Plasma Cannon</b></div>
    <div class="role" id="role">Core DPS</div>
    <div class="stat"><span>Cost</span><b id="cost">52</b></div>
    <div class="stat"><span>Range</span><b id="range">142</b></div>
    <div class="stat"><span>Fire Rate</span><b id="rate">1.00/s</b></div>
    <div class="stat"><span>Damage</span><b id="damage">26</b></div>
    <p id="desc"></p>
  </div>
  <div id="status" class="panel"><span class="dot"></span><span>GLB MODEL ACTIVE</span></div>
  <div id="mode">
    <button id="combat" class="active">COMBAT</button>
    <button id="idle">IDLE</button>
  </div>
  <div id="dock" class="panel"></div>
  <div id="loader"><div class="loaderBox"><div class="orb"></div><b>LOADING REAL 3D TOWER</b><span>Game-ready GLB model</span></div></div>
</div>
<script src="models-pack.js?v=real3d4"></script>
<script type="module" src="real3d.js?v=real3d4"></script>
</body>
</html>
