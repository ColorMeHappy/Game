name: LexiFrance one-time metadata normalization
on:
  push:
    branches:
      - lexifrance-v5-solve2
    paths:
      - 'legal-app/metadata-normalize.mjs'
      - '.github/workflows/lexifrance-metadata-normalize.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node legal-app/metadata-normalize.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal-app/content/lessons/*.json legal-app/content/catalog/*.json
          git diff --cached --quiet && exit 0
          git commit -m "Normalize LexiFrance content release metadata"
          git push
