name: LexiFrance one-time SOLVE schema correction
on:
  push:
    branches:
      - lexifrance-v5-solve2
    paths:
      - 'legal-app/solve-fix.mjs'
      - '.github/workflows/lexifrance-solve-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node legal-app/solve-fix.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal-app/content/cases/*.json
          git diff --cached --quiet && exit 0
          git commit -m "Correct SOLVE 2.0 scoring schema"
          git push
