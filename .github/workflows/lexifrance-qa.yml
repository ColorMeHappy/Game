name: LexiFrance QA

on:
  push:
    branches:
      - main
      - lexifrance-v5-quality
    paths:
      - 'legal-app/**'
      - '.github/workflows/lexifrance-qa.yml'
  pull_request:
    paths:
      - 'legal-app/**'

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check legal-app/app.js
          for f in legal-app/js/*.js; do node --check "$f"; done
          node --check legal-app/qa.mjs
          node --check legal-app/qa-assets.mjs
          node --check legal-app/qa-legacy.mjs
          node --check legal-app/e2e.mjs
      - name: Validate content, quiz, cases, updates and PWA
        run: |
          node legal-app/qa.mjs
          node legal-app/qa-assets.mjs
          node legal-app/qa-legacy.mjs

  browser:
    needs: integrity
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/lexifrance-http.log 2>&1 &
          sleep 2
      - name: Mobile, Mastery, SOLVE, Search and offline E2E
        run: timeout 90s node legal-app/e2e.mjs
