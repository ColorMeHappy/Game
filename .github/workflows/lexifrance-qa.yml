name: LexiFrance QA

on:
  push:
    branches:
      - main
      - lexifrance-v5-solve2
      - lexifrance-next-phase1
      - lexifrance-next-phase2-foundation
    paths:
      - 'legal-app/**'
      - '.github/workflows/lexifrance-qa.yml'
  pull_request:
    paths:
      - 'legal-app/**'

concurrency:
  group: lexifrance-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check legal-app/app.js
          for f in legal-app/js/*.js; do node --check "$f"; done
          for f in legal-app/qa*.mjs legal-app/e2e.mjs legal-app/e2e-wrapper.mjs legal-app/webkit-smoke.mjs legal-app/webkit-wrapper.mjs; do node --check "$f"; done
      - name: Import/export graph
        run: node legal-app/qa-imports.mjs
      - name: Core integrity
        run: node legal-app/qa.mjs
      - name: Cloud and sync integrity
        run: node legal-app/qa-cloud.mjs
      - name: Skill Graph foundation integrity
        run: node legal-app/qa-skill.mjs
      - name: Quiz editorial integrity
        run: node legal-app/qa-quiz.mjs
      - name: SOLVE 2.0 schema and progression
        run: node legal-app/qa-cases.mjs
      - name: Search Top-1 and Top-3
        run: node legal-app/qa-search.mjs
      - name: PWA assets
        run: node legal-app/qa-assets.mjs
      - name: Service Worker failure fallback
        run: node legal-app/qa-sw.mjs
      - name: Legacy code removal
        run: node legal-app/qa-legacy.mjs

  browser:
    needs: integrity
    timeout-minutes: 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/lexifrance-http.log 2>&1 &
          sleep 2
      - name: V5.1 mobile, Quiz, SOLVE, orientation, migration and offline E2E
        run: timeout 180s node legal-app/e2e-wrapper.mjs
      - name: Confidence calibration behavior
        run: timeout 120s node legal-app/qa-confidence.mjs

  accessibility:
    needs: integrity
    timeout-minutes: 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install accessibility test runtime
        run: |
          npm install --no-save playwright@1.62.1 @axe-core/playwright@4.13.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/lexifrance-http-a11y.log 2>&1 &
          sleep 2
      - name: WCAG accessibility regression
        run: timeout 150s node legal-app/qa-a11y.mjs

  webkit:
    needs: integrity
    timeout-minutes: 9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps webkit
      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/lexifrance-http-webkit.log 2>&1 &
          sleep 2
      - name: iPhone portrait-only WebKit QA
        run: timeout 120s node legal-app/webkit-wrapper.mjs
