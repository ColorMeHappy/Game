name: LexiFrance one-time Quiz editorial migration
on:
  push:
    branches:
      - lexifrance-v5-solve2
    paths:
      - 'legal-app/editorial-migrate.mjs'
      - '.github/workflows/lexifrance-editorial-migrate.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic editorial migration
        run: node legal-app/editorial-migrate.mjs
      - name: Commit normalized Quiz content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal-app/content/quizzes/*.json
          git diff --cached --quiet && exit 0
          git commit -m "Apply Quiz editorial normalization"
          git push
