name: LexiFrance one-time lesson cleanup

on:
  push:
    branches:
      - lexifrance-v5-quality
    paths:
      - '.github/workflows/lexifrance-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexifrance-v5-quality
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove legacy embedded quizzes
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const dir='legal-app/content/lessons';
          let changed=0;
          for(const name of fs.readdirSync(dir).filter(x=>x.endsWith('.json'))){
            const file=path.join(dir,name);
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            if(Object.prototype.hasOwnProperty.call(data,'quiz')){
              delete data.quiz;
              fs.writeFileSync(file,JSON.stringify(data));
              changed++;
            }
          }
          console.log(`Removed legacy quiz from ${changed} lesson files`);
          NODE
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add legal-app/content/lessons
          if git diff --cached --quiet; then
            echo 'No legacy quiz fields found'
          else
            git commit -m 'Remove legacy embedded lesson quizzes'
            git push origin HEAD:lexifrance-v5-quality
          fi
