name: LexiFrance one-time Phase 1 integration

on:
  push:
    branches:
      - lexifrance-next-phase1
    paths:
      - 'legal-app/phase1-apply.mjs'
      - '.github/workflows/lexifrance-phase1-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexifrance-next-phase1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Phase 1 patch
        run: node legal-app/phase1-apply.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal-app .github/workflows/lexifrance-qa.yml
          git commit -m "Integrate Supabase cloud foundation into LexiFrance" || exit 0
          git push origin HEAD:lexifrance-next-phase1
