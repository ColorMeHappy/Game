name: LexiFrance one-time Search tuning
on:
  push:
    branches:
      - lexifrance-v5-solve2
    paths:
      - 'legal-app/search-tune.mjs'
      - '.github/workflows/lexifrance-search-tune.yml'
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node legal-app/search-tune.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal-app/content/search/core.json legal-app/content/cases/index-v2.json
          git diff --cached --quiet && exit 0
          git commit -m "Tune deterministic Search priorities"
          git push
