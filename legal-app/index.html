<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1320"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="LexiFrance"><link rel="manifest" href="./manifest.webmanifest"><title>LexiFrance</title><style>body{margin:0;background:#f4f6fa;font-family:-apple-system,BlinkMacSystemFont,system-ui;color:#101522}.l{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.s{width:42px;height:42px;border:4px solid #dce3f8;border-top-color:#315cff;border-radius:50%;animation:r .8s linear infinite;margin:auto}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="l"><div><div class="s"></div><h2>LexiFrance</h2><p>Загрузка проверенной юридической базы...</p></div></div><script>(async()=>{try{let b='';for(let i=1;i<=5;i++)b+=await(await fetch('./chunk'+i+'.txt',{cache:'no-store'})).text();const x=Uint8Array.from(atob(b.trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const h=await new Response(new Blob([x]).stream().pipeThrough(ds)).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="l"><div><h2>Ошибка загрузки</h2><p>Обновите страницу.</p></div></div>'}})();</script></body></html>
